name: 扫雷
package: com.wt.sweepmine
version: 1
learned_at: '2026-10-30T15:00:00'

rules:
  - 棋盘由若干格子组成，每个格子可能是覆盖状态、已翻开状态、或已插旗状态
  - 已翻开的格子若显示数字，则该数字等于其周围 8 个格子中的地雷数量
  - 已翻开的格子若为空白（无数字），则其周围 8 格均无雷，并自动连锁展开翻开相邻空白及数字格
  - 点击覆盖格：若该格是雷则踩雷失败；若是空白则连锁展开；若是数字则仅显示该数字
  - 长按覆盖格可切换插旗状态（插旗/取消旗）
  - 已插旗的格子不能再被点击翻开，需再次长按取消旗后才能操作
  - 数字格周围已插旗数等于该数字时，其余未开格子必为安全格（高级推导基础）

controls:
  - 点击（短按）：翻开一个覆盖格
  - 长按（约 700ms）：在覆盖格上插旗或取消旗
  - 结算弹窗点击「再玩一局」：重开一局

win_condition: 右上角红色七段码计数器归零（即所有地雷都已正确插旗），随后弹出「恭喜通关」对话框
lose_condition: 点击到地雷格，弹出失败对话框

ui_elements:
  雷数计数器:
    description: 右上角红色七段码 LED，显示剩余未标雷数（如 031 表示 31 个雷未标）
    location: 屏幕右上角，红色发光段
  计时器:
    description: 左上角红色七段码 LED，显示已用时间（秒）
    location: 屏幕左上角
  棋盘区域:
    description: 由网格线分隔的方形格子区域
    location: 屏幕中部偏下，约占屏幕 70% 面积
  结算弹窗:
    description: 游戏结束时弹出的对话框，含「再玩一局」按钮
    location: 屏幕中央，画面整体变暗

notes: |
  该版本扫雷的胜利条件是"所有雷都被插旗标出"，而不是传统扫雷的"翻开所有安全格"。
  因此策略上需要：1) 通过数字推导安全格并翻开；2) 通过推导确定雷位并插旗；
  3) 当计数器归零时等待胜利弹窗确认。
  棋盘几何：13 行 × 24 列，共 31 个雷。
  格子尺寸约 95×94 像素，棋盘区域约 (149,330)-(2430,1554)。

sources:
  - https://m.34347.com/game/28213.html
  - https://www.zhihu.com/question/28996011
